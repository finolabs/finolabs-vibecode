<!doctype html>
<!-- Fixed fixture for the ui-review-gate snippets. The fake DOM in tests/ui_snippet_runner.js has no layout engine:
     each element's box is the left, top, width and height in its style attribute, in CSS px. -->
<html lang="en">
<body style="background-color: rgb(255, 255, 255); color: rgb(0, 0, 0)">
  <p id="dark-text">Black on white</p>
  <p id="grey-text" style="color: rgb(129, 129, 129)">Grey 3.9 to 1 on white</p>
  <h1 id="large-grey" style="color: rgb(129, 129, 129); font-size: 32px; font-weight: 700">Large grey heading</h1>
  <button id="small" style="left: 10px; top: 100px; width: 20px; height: 20px; background-color: rgb(0, 0, 0); color: rgb(255, 255, 255)">x</button>
  <button id="medium" style="left: 31px; top: 100px; width: 30px; height: 30px; background-color: rgb(0, 0, 0); color: rgb(255, 255, 255)">Go</button>
  <button id="spaced" style="left: 300px; top: 300px; width: 20px; height: 20px; background-color: rgb(0, 0, 0); color: rgb(255, 255, 255)">?</button>
  <p id="sentence">Read the <a id="inline-link" href="#terms" style="display: inline; left: 60px; top: 400px; width: 30px; height: 16px">terms</a> first.</p>
  <p id="near-threshold" style="color: rgb(100, 122, 134)">Just under 4.5 to 1 on white</p>
  <div id="faded" style="opacity: 0.2"><p id="faded-text" style="background-color: rgb(255, 255, 255)">Black on white inside a faded parent</p></div>
  <p id="wrapped">Read the <span><a id="wrapped-link" href="#privacy" style="display: inline; left: 60px; top: 1400px; width: 30px; height: 16px">privacy</a></span> notice.</p>
  <div id="standalone-wrap"><a id="standalone-link" href="#help" style="display: inline; left: 60px; top: 1500px; width: 20px; height: 16px">?</a><a id="standalone-near" href="#more" style="display: inline; left: 82px; top: 1500px; width: 20px; height: 16px">!</a><p id="unrelated">An unrelated paragraph beside the links.</p></div>
  <div id="wide" style="left: 0px; top: 500px; width: 600px; height: 40px"><span id="wide-child" style="left: 0px; top: 500px; width: 600px; height: 20px">wide</span></div>
  <div id="table-wrap" style="overflow-x: auto; left: 0px; top: 600px; width: 390px; height: 200px"><table id="data" style="left: 0px; top: 600px; width: 800px; height: 200px"><tr><td>cell</td></tr></table></div>
  <form id="signup" style="left: 0px; top: 900px; width: 390px; height: 400px">
    <input type="hidden" name="token">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required style="left: 0px; top: 920px; width: 300px; height: 48px">
    <input id="full-name" name="full_name" aria-label="Full name" autocomplete="name" style="left: 0px; top: 980px; width: 300px; height: 48px">
    <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="Phone" style="left: 0px; top: 1040px; width: 300px; height: 48px">
    <button type="submit" style="left: 0px; top: 1100px; width: 120px; height: 48px; background-color: rgb(0, 0, 0); color: rgb(255, 255, 255)">Sign up</button>
  </form>
</body>
</html>
