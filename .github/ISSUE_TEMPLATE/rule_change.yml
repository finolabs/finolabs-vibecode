name: Rule change
description: Propose adding, changing or removing a rule in a skill.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The failure the current rule causes or misses, with an example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed rule
      description: The new wording, the skill it belongs in, and the evidence that it works.
    validations:
      required: true
