name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      - name: No secrets in the tree or history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors --max-time 120 -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - name: No personal paths or addresses
        run: |
          # Machine paths and email addresses other than the published contact,
          # the commit attribution and example.com placeholders. Prints file and
          # line only, so a match never lands in the public log.
          pattern='/Users/[A-Za-z]|/home/[a-z][a-z0-9_-]*/|C:\\Users\\[A-Za-z]|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}'
          found=$(git grep -n -I -E "$pattern" -- . \
            | sed -E 's/finos@finolabs\.io|noreply@anthropic\.com|[A-Za-z0-9._%+-]+@example\.com//g' \
            | grep -E "$pattern" | cut -d: -f1,2 || true)
          if [ -n "$found" ]; then
            printf 'Personal paths or addresses at:\n%s\n' "$found"
            exit 1
          fi
      - name: Script tests
        run: python3 -m unittest discover -s tests -v
      - name: Cross-references resolve
        run: python3 -I scripts/check-references.py
      - name: No ignored file is tracked
        run: |
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            printf 'Ignored files are tracked:\n%s\n' "$tracked_ignored"
            exit 1
          fi
      - name: Manifest versions match
        run: |
          python3 - <<'PY'
          import json, sys
          paths = [".claude-plugin/plugin.json", ".codex-plugin/plugin.json", ".antigravity-plugin/plugin.json"]
          versions = {p: json.load(open(p))["version"] for p in paths}
          print(versions)
          sys.exit(len(set(versions.values())) != 1)
          PY
      - name: Skill folder names match their name field
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for p in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              m = re.search(r"^name: (.+)$", p.read_text(), re.M)
              if not m or m.group(1).strip() != p.parent.name or not p.parent.name.startswith("fnl-"):
                  bad.append(str(p))
          print("\n".join(bad) or "all skills ok")
          sys.exit(bool(bad))
          PY
      - name: Copies of shared skill files match
        run: |
          python3 - <<'PY'
          import filecmp, sys
          groups = [['scripts/run_env.py', 'skills/fnl-delegate/scripts/run_env.py', 'skills/fnl-verification/scripts/run_env.py'],
                    ['scripts/delegate_env.py', 'skills/fnl-delegate/scripts/delegate_env.py'],
                    ['scripts/log_scan.py', 'skills/fnl-delegate/scripts/log_scan.py'],
                    ['scripts/secret_patterns.py', 'skills/fnl-delegate/scripts/secret_patterns.py', 'skills/fnl-handoff/scripts/secret_patterns.py'],
                    ['scripts/brief_check.py', 'skills/fnl-handoff/scripts/brief_check.py'],
                    ["scripts/instructions_write.py", "skills/fnl-setup/scripts/instructions_write.py"],
                    ["scripts/data_root.py", "skills/fnl-coding-router/scripts/data_root.py", "skills/fnl-delegate/scripts/data_root.py", "skills/fnl-review-gate/scripts/data_root.py", "skills/fnl-setup/scripts/data_root.py", "skills/fnl-status/scripts/data_root.py", "skills/fnl-session-hygiene/scripts/data_root.py", "skills/fnl-verification/scripts/data_root.py", "skills/fnl-restore-point/scripts/data_root.py", "skills/fnl-update/scripts/data_root.py"],
                    ["scripts/fnl_metrics.py", "skills/fnl-coding-router/scripts/fnl_metrics.py", "skills/fnl-status/scripts/fnl_metrics.py", "skills/fnl-update/scripts/fnl_metrics.py"],
                    ["skills/fnl-ask/references/plain-language.md", "skills/fnl-setup/references/plain-language.md"],
                    ["skills/fnl-ask/references/plain-terms.md", "skills/fnl-setup/references/plain-terms.md"],
                    ["scripts/quota_probe.py", "skills/fnl-setup/scripts/quota_probe.py", "skills/fnl-delegate/scripts/quota_probe.py", "skills/fnl-update/scripts/quota_probe.py", "skills/fnl-review-gate/scripts/quota_probe.py"],
                    ["scripts/review_route.py", "skills/fnl-delegate/scripts/review_route.py", "skills/fnl-review-gate/scripts/review_route.py"],
                    ["scripts/review_config.py", "skills/fnl-delegate/scripts/review_config.py", "skills/fnl-review-gate/scripts/review_config.py"],
                    ["scripts/git_metadata.py", "skills/fnl-delegate/scripts/git_metadata.py", "skills/fnl-review-gate/scripts/git_metadata.py"],
                    ["scripts/post_review.py", "skills/fnl-review-gate/scripts/post_review.py"],
                    ["scripts/project_progress.py", "skills/fnl-status/scripts/project_progress.py", "skills/fnl-setup/scripts/project_progress.py"],
                    ["scripts/agent_processes.py", "skills/fnl-status/scripts/agent_processes.py", "skills/fnl-setup/scripts/agent_processes.py"],
                    ["scripts/judge.py", "skills/fnl-delegate/scripts/judge.py", "skills/fnl-session-hygiene/scripts/judge.py", "skills/fnl-verification/scripts/judge.py"],
                    ["scripts/verify_claim.py", "skills/fnl-verification/scripts/verify_claim.py"],
                    ["scripts/record.py", "skills/fnl-coding-router/scripts/record.py", "skills/fnl-delegate/scripts/record.py", "skills/fnl-verification/scripts/record.py"],
                    ["scripts/context_steward.py", "skills/fnl-session-hygiene/scripts/context_steward.py"],
                    ["scripts/parallel_slots.py", "skills/fnl-delegate/scripts/parallel_slots.py", "skills/fnl-status/scripts/parallel_slots.py"],
                    ["scripts/context_snapshot.py", "skills/fnl-session-hygiene/scripts/context_snapshot.py"],
                    ["scripts/statusline_setup.py", "skills/fnl-setup/scripts/statusline_setup.py"],
                    ["scripts/compact_setup.py", "skills/fnl-setup/scripts/compact_setup.py"],
                    ["scripts/auto_gate.py", "skills/fnl-delegate/scripts/auto_gate.py"],
                    ["scripts/handover_state.py", "skills/fnl-delegate/scripts/handover_state.py"],
                    ["scripts/mode.py", "skills/fnl-delegate/scripts/mode.py", "skills/fnl-setup/scripts/mode.py"]]
          bad = [g for g in groups if not all(filecmp.cmp(g[0], p, shallow=False) for p in g[1:])]
          print(bad or "shared copies match")
          sys.exit(bool(bad))
          PY
      - name: Skills stay self-contained
        run: |
          if grep -rnE "folders? above this skill|\.\./\.\./" skills; then
            echo "A skill reaches outside its own folder; single-skill installs would break."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Claude Code plugin validator
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.316
          claude plugin validate .
