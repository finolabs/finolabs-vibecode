name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No ignored file is tracked
        run: |
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            printf 'Ignored files are tracked:\n%s\n' "$tracked_ignored"
            exit 1
          fi
      - name: Manifest versions match
        run: |
          python3 - <<'PY'
          import json, sys
          paths = [".claude-plugin/plugin.json", ".codex-plugin/plugin.json", ".antigravity-plugin/plugin.json"]
          versions = {p: json.load(open(p))["version"] for p in paths}
          print(versions)
          sys.exit(len(set(versions.values())) != 1)
          PY
      - name: Skill folder names match their name field
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for p in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              m = re.search(r"^name: (.+)$", p.read_text(), re.M)
              if not m or m.group(1).strip() != p.parent.name or not p.parent.name.startswith("fnl-"):
                  bad.append(str(p))
          print("\n".join(bad) or "all skills ok")
          sys.exit(bool(bad))
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Claude Code plugin validator
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.316
          claude plugin validate .
