<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'unsafe-inline'">
<title>Vibecode Status</title>
<style>
html, body { margin: 0; }
[hidden] { display: none !important; }
/* One terminal window: shared prompt and KPIs above the tabbed panes. */
:root {
  --bg: #07040d; --field-top: #14081f; --surface: #0f0a19; --raised: #181029; --line: #2a1d40;
  --fg: #f7f2fc; --muted: #b9a6cf; --faint: #8f7ba8;
  --p: #7fe2ce; --brand: #7fe2ce; --violet: #b88cf0; --prompt: #7fe2ce; --glow: rgba(127, 226, 206, .4); --grid: rgba(247, 242, 252, .035);
  --good: #7fe2ce; --warn: #e3b341; --crit: #ff7b72;
  --h0: #181029; --h1: #1e5a55; --h2: #2b8c7d; --h3: #4fc0a8; --h4: #7fe2ce;
  --on1: #f7f2fc; --on2: #07040d; --on3: #07040d; --on4: #07040d;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --t-xs: 11px; --t-sm: 12px; --t-md: 13px; --t-lg: 15px; --t-kpi: clamp(30px, 6vw, 40px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f2fc; --field-top: #eadff6; --surface: #ffffff; --raised: #eadff6; --line: #d6c5e8;
    --fg: #22123a; --muted: #5f4a7a; --faint: #7e6a99;
    --p: #7a3fa6; --brand: #9750c4; --violet: #7a3fa6; --prompt: #7a3fa6; --glow: rgba(122, 63, 166, 0); --grid: rgba(34, 18, 58, .05);
    --good: #1b7a66; --warn: #9a6700; --crit: #cf222e;
    --h0: #eadff6; --h1: #d6bdee; --h2: #b88fdc; --h3: #9455c4; --h4: #7a3fa6;
    --on1: #22123a; --on2: #22123a; --on3: #ffffff; --on4: #ffffff;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f7f2fc; --field-top: #eadff6; --surface: #ffffff; --raised: #eadff6; --line: #d6c5e8;
  --fg: #22123a; --muted: #5f4a7a; --faint: #7e6a99;
  --p: #7a3fa6; --brand: #9750c4; --violet: #7a3fa6; --prompt: #7a3fa6; --glow: rgba(122, 63, 166, 0); --grid: rgba(34, 18, 58, .05);
  --good: #1b7a66; --warn: #9a6700; --crit: #cf222e;
  --h0: #eadff6; --h1: #d6bdee; --h2: #b88fdc; --h3: #9455c4; --h4: #7a3fa6;
    --on1: #22123a; --on2: #22123a; --on3: #ffffff; --on4: #ffffff;
  color-scheme: light;
}
body {
  background: var(--bg); color: var(--fg); font: var(--t-md)/1.5 var(--mono);
  background-image: radial-gradient(var(--grid) 1px, transparent 1px), linear-gradient(180deg, var(--field-top), var(--bg) 420px);
  background-size: 22px 22px, 100% 100%; background-repeat: repeat, no-repeat;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.win { max-width: 1120px; margin: 0 auto; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--bg) 92%, transparent); overflow: hidden; overflow: clip; }
.bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--muted); font-size: var(--t-sm); }
.dots { display: flex; gap: 6px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); display: block; }
.bar .title { flex: 1; text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.theme { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.theme button { font: inherit; font-size: var(--t-xs); color: var(--muted); background: transparent; border: 0; padding: 2px 10px; cursor: pointer; }
.theme button + button { border-left: 1px solid var(--line); }
.theme button:hover { color: var(--fg); }
.theme button[aria-pressed="true"] { background: var(--raised); color: var(--prompt); }
button:focus-visible, summary:focus-visible, .heat i:focus-visible, svg:focus-visible { outline: 2px solid var(--p); outline-offset: 2px; }
.screen { padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; position: relative; }
.tablist { display: flex; min-width: 0; max-width: 100%; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tablist button { flex: 0 0 auto; font: inherit; color: var(--muted); background: var(--surface); border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; }
.tablist button[aria-selected="true"] { color: var(--prompt); border-bottom-color: var(--p); background: var(--raised); }
.tablist .count { margin-left: 6px; font-size: var(--t-xs); }
.tabpanel { display: grid; gap: 16px; min-width: 0; max-height: 75vh; overflow: auto; }
.cmd { font-size: var(--t-lg); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.cmd .ps { color: var(--prompt); text-shadow: 0 0 12px var(--glow); }
.cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--prompt); vertical-align: text-bottom; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
.meta { color: var(--muted); font-size: var(--t-sm); }

/* KPI tiles: label, value with a 12-week column chart on the baseline, delta. */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; display: grid; gap: 8px; }
.kpi .k { color: var(--muted); font-size: var(--t-sm); }
.kpi .m { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.kpi .v { font-size: var(--t-kpi); font-weight: 700; line-height: 1; text-shadow: 0 0 22px var(--glow); }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 36px; flex: 1; max-width: 110px; }
.spark i { flex: 1; max-width: 12px; border-radius: 3px 3px 0 0; background: var(--p); opacity: .38; display: block; }
.spark i:last-child { opacity: 1; }
.kpi .d { font-size: var(--t-xs); color: var(--muted); min-height: 1.4em; }
.kpi .d.up { color: var(--good); } .kpi .d.down { color: var(--crit); }

/* Panes */
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.g2 .tall { grid-row: span 2; }
.pane { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; display: flex; flex-direction: column; }
.pane > h2 { margin: 0; padding: 9px 14px; font-size: var(--t-sm); font-weight: 600; color: var(--fg); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.pane > h2 span:first-child::before { content: "▍"; color: var(--prompt); margin-right: 6px; }
.pane > h2 span + span { color: var(--faint); font-weight: 400; }
.pane .body { padding: 14px; display: grid; gap: 14px; align-content: start; flex: 1; }
.pane.wide { grid-column: 1 / -1; }
.nodata { color: var(--faint); }
.nodata::before { content: "// "; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: var(--t-xs); }
.legend b { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.stat { display: flex; align-items: baseline; gap: 10px; }
.stat strong { font-size: 28px; line-height: 1; }
.stat span { color: var(--muted); font-size: var(--t-sm); }

/* Horizontal bars: baseline at the left, 4px rounded data end, value at the tip, no track. */
.hb { display: grid; gap: 8px; }
.tall .hb { gap: 12px; }
.hb .r { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr); gap: 10px; align-items: center; font-size: var(--t-sm); }
.hb .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .trk { display: flex; align-items: center; gap: 8px; padding-right: 3.6em; border-left: 1px solid var(--line); min-height: 14px; }
.hb .trk > i, .hb .stk { height: 12px; flex: none; display: flex; gap: 2px; }
.hb .trk > i { border-radius: 0 4px 4px 0; min-width: 2px; display: block; }
.hb .stk i { display: block; height: 100%; min-width: 2px; }
.hb .stk i:first-child { border-radius: 0 0 0 0; } .hb .stk i:last-child { border-radius: 0 4px 4px 0; }
.hb .v { color: var(--muted); white-space: nowrap; font-size: var(--t-xs); }

/* Router composition: one stacked bar with an "eligible" bracket. */
.seg { display: flex; gap: 2px; height: 16px; }
.seg i { display: block; min-width: 3px; border-radius: 2px; }
.brk { height: 6px; border: 1px solid var(--faint); border-top: 0; border-radius: 0 0 3px 3px; margin-top: 4px; }
.brk + .meta { margin-top: -6px; }

/* Delegation: lollipop on a 0-100% axis, quota and error as aligned counts. */
.dl { display: grid; gap: 4px; }
.dl .r { display: grid; grid-template-columns: minmax(0, 17em) minmax(0, 1fr) 3.4em 3.4em; gap: 12px; align-items: center; font-size: var(--t-sm); padding: 6px 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.dl .r.h { border-top: 0; padding: 0 0 2px; color: var(--faint); font-size: var(--t-xs); }
.dl .who { min-width: 0; line-height: 1.25; } .dl .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dl .ax { position: relative; height: 14px; } .dl .ax span { position: absolute; transform: translateX(-50%); }
.dl .ax span:first-child { transform: none; } .dl .ax span:last-child { transform: translateX(-100%); }
.dl .trk { position: relative; height: 22px; }
.dl .trk::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 1px; background: var(--line); }
.dl .th { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--faint); }
.dl .stem { position: absolute; left: 0; top: 10px; height: 2px; margin-top: -.5px; border-radius: 0 1px 1px 0; opacity: .55; }
.dl .dot { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; box-sizing: border-box; border: 2px solid; box-shadow: 0 0 0 2px var(--surface); background: currentColor; }
.dl .dot.open { background: var(--surface); }
.dl .na { position: absolute; left: 0; top: 3px; color: var(--faint); font-size: var(--t-xs); }
.dl .c { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.dl .c::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.dl .c.z { opacity: .4; }

/* Review gate timeline */
.rv { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px 20px; }
.rv .r { display: grid; grid-template-columns: minmax(0, 9em) 1fr; gap: 12px; align-items: center; font-size: var(--t-sm); }
.rv .seq { display: flex; align-items: center; }
.rv .seq svg { width: 18px; height: 18px; flex: none; }
.rv .seq .ln { width: 14px; height: 2px; background: var(--line); }

/* Activity as a compact month calendar: Monday first, a small date in each cell, shade by count (the count is in the tooltip and the aria label). A side column carries the month's numbers. */
.calwrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 28px; align-items: start; }
.calmain { display: grid; gap: 8px; width: max-content; max-width: 100%; }
.calnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.calnav strong { font-size: var(--t-md); }
.calnav button { font: inherit; font-size: 15px; line-height: 1; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
.calnav button:hover:not(:disabled) { color: var(--fg); background: var(--raised); }
.calnav button:disabled { opacity: .35; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 28px); gap: 3px; }
.cal .wd { color: var(--faint); font-size: 10px; text-align: center; }
.cal .dy { aspect-ratio: 1; border-radius: 4px; background: var(--h0); padding: 2px 3px; font-size: 9px; line-height: 1; color: var(--muted); min-width: 0; }
.cal .dy.pad { visibility: hidden; }
.calside { display: grid; gap: 14px; align-content: start; }
.stat2 strong { display: block; font-size: 22px; line-height: 1.1; }
.stat2 span { color: var(--muted); font-size: var(--t-xs); }
.wdc { display: flex; align-items: flex-end; gap: 4px; height: 56px; }
.wdc div { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; min-width: 0; }
.wdc i { width: 100%; max-width: 14px; border-radius: 3px 3px 0 0; background: var(--p); opacity: .4; display: block; }
.wdc i.max { opacity: 1; }
.wdc em { font-style: normal; font-size: 10px; color: var(--faint); }
.cal-title { color: var(--muted); font-size: var(--t-xs); margin-bottom: 4px; }
.cal .dy.out { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--faint); }
.cal .dy[data-l="1"] { background: var(--h1); color: var(--on1); } .cal .dy[data-l="2"] { background: var(--h2); color: var(--on2); }
.cal .dy[data-l="3"] { background: var(--h3); color: var(--on3); } .cal .dy[data-l="4"] { background: var(--h4); color: var(--on4); }
.cal .dy.now { box-shadow: 0 0 0 2px var(--p); }
.scale { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: var(--t-xs); justify-content: flex-end; }
.scale i { width: 12px; height: 12px; border-radius: 2px; display: block; }

.status { display: flex; flex-wrap: wrap; gap: 6px 24px; justify-content: space-between; align-items: center; color: var(--faint); font-size: var(--t-xs); }
.src { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: var(--t-sm); color: var(--fg); align-items: center; }
.src b { font-weight: 400; color: var(--muted); }
.src span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; background: var(--good); }
.src span.no::before { background: var(--warn); }
details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details > summary { cursor: pointer; color: var(--muted); font-size: var(--t-sm); padding: 8px 14px; }
details .tables { padding: 4px 14px 14px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.tbl { overflow-x: auto; }
.tbl h3 { margin: 0 0 6px; font-size: var(--t-sm); color: var(--muted); font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: var(--t-xs); }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 3px 10px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 3px 10px 3px 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.r, th.r { text-align: right; }
.win { position: relative; }
.ghost { background: var(--raised); border-radius: 4px; display: block; }
.skel .ghost { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .skel .ghost { animation: none; } }
.spark i.ghost { background: var(--raised); opacity: 1; }
.spark i.gap { opacity: .2; }
.cal .dy.ghost { background: var(--raised); padding: 0; }
.grow { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr); gap: 10px; align-items: center; }
.skel .nodata { display: none; }
.skel .kpi .v { color: var(--faint); text-shadow: none; }
/* Empty state: a veil blurs the placeholder panes and a card sits in view above it, sticky so it stays visible on a long phone page. */
.veil { position: absolute; inset: 0; z-index: 5; display: flex; justify-content: center; align-items: flex-start; padding: 0 16px; background: color-mix(in srgb, var(--bg) 28%, transparent); -webkit-backdrop-filter: blur(2.5px); backdrop-filter: blur(2.5px); }
.notice { position: sticky; top: 120px; margin-top: 140px; width: min(420px, 100%); box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; display: grid; justify-items: center; gap: 6px; text-align: center; box-shadow: 0 18px 60px rgba(0, 0, 0, .5); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .notice { box-shadow: 0 18px 60px rgba(34, 18, 58, .22); } }
:root[data-theme="light"] .notice { box-shadow: 0 18px 60px rgba(34, 18, 58, .22); }
.notice .badge { width: 64px; height: 64px; margin-bottom: 4px; color: var(--brand); }
.notice .badge svg { width: 100%; height: 100%; display: block; }
.notice strong { font-size: var(--t-lg); }
.notice span { color: var(--muted); font-size: var(--t-sm); }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--raised); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: var(--t-xs); box-shadow: 0 6px 24px rgba(0, 0, 0, .35); max-width: 260px; }
@media (max-width: 900px) { .g2 { grid-template-columns: 1fr; } .g2 .tall { grid-row: auto; } }
@media (max-width: 560px) {
  .screen { padding: 12px; }
  .calwrap { grid-template-columns: 1fr; } .calmain { width: auto; } .cal { grid-template-columns: repeat(7, minmax(0, 1fr)); } .cal .dy { aspect-ratio: 1.35; }
  .calside { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } .calside > :last-child { grid-column: 1 / -1; } .stat2 strong { font-size: 18px; }
  .hb .r { grid-template-columns: 1fr; gap: 3px; }
  .dl .r { grid-template-columns: minmax(0, 1fr) 3.4em 3.4em; } .dl .r > .trk, .dl .r > .ax { grid-column: 1 / -1; order: 3; } .dl .r.h > :first-child { visibility: hidden; } .dl .r.h .ax { display: none; }
  .rv .r { grid-template-columns: 1fr; gap: 4px; }
}
</style>
</head>
<body>
<main class="win" aria-label="Vibecode status dashboard">
  <div class="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="title" id="wtitle">fnl-status</span><div class="theme" role="group" aria-label="Color theme"><button type="button" id="th-dark" aria-pressed="false">dark</button><button type="button" id="th-light" aria-pressed="false">light</button></div></div>
  <div class="screen" id="app"></div>
</main>
<div id="tip" hidden></div>
<script src="data.js"></script>
<script>
(function () {
  "use strict";
  /* data.js sits beside this page and sets window.FNL_DATA; without it the page shows an empty state. */
  function dataNow() { return window.FNL_DATA && typeof window.FNL_DATA === "object" ? window.FNL_DATA : null; }
  var D = dataNow();
  var app = document.getElementById("app"), tip = document.getElementById("tip");

  /* Theme switch: follows the viewer until clicked, then remembers the choice when storage allows. */
  var root = document.documentElement, KEY = "fnl-theme";
  function current() {
    var a = root.getAttribute("data-theme");
    if (a === "dark" || a === "light") return a;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  function paint() {
    var c = current();
    document.getElementById("th-dark").setAttribute("aria-pressed", String(c === "dark"));
    document.getElementById("th-light").setAttribute("aria-pressed", String(c === "light"));
  }
  function setTheme(v) {
    root.setAttribute("data-theme", v);
    try { localStorage.setItem(KEY, v); } catch (e) { /* storage can be blocked */ }
    paint();
  }
  try { var saved = localStorage.getItem(KEY); if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved); } catch (e) { /* storage can be blocked */ }
  document.getElementById("th-dark").addEventListener("click", function () { setTheme("dark"); });
  document.getElementById("th-light").addEventListener("click", function () { setTheme("light"); });
  paint();

  /* Builders: every value reaches the page as text or an attribute, never as markup. */
  var NS = "http://www.w3.org/2000/svg";
  function h(tag, cls, kids) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    (kids || []).forEach(function (k) { if (k != null) el.appendChild(typeof k === "string" ? document.createTextNode(k) : k); });
    return el;
  }
  function t(tag, cls, text) { return h(tag, cls, [String(text)]); }
  function s(tag, attrs) {
    var el = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, String(attrs[k])); });
    return el;
  }
  function tipOn(el, text) { el.setAttribute("data-tip", text); return el; }
  function pct(v) { return v == null ? "—" : Math.round(v * 100) + "%"; }
  function num(v) { return v == null ? "—" : String(v); }
  function tok(v) { return v >= 1000 ? (Math.round(v / 100) / 10) + "k" : String(v); }
  function missing(k) { return D.missing && D.missing[k]; }
  function stack(kids) { var g = h("div", "", kids); g.style.display = "grid"; g.style.gap = "12px"; return g; }
  function swatch(c) { var b = h("b"); b.style.background = c; return b; }
  function legend(items) { return h("div", "legend", items.map(function (i) { return h("span", "", [swatch(i[1]), i[0]]); })); }
  /* Placeholder shapes keep an empty pane the size of a filled one. */
  var GW = ["92%", "78%", "60%", "44%", "36%", "28%", "22%", "16%"];
  function ghost(w, hgt) { var g = h("i", "ghost"); g.style.width = w; g.style.height = hgt || "12px"; return g; }

      function cnt(n, c) { var e = t("span", "c" + (n ? "" : " z"), n); e.style.setProperty("--c", c); return e; }
      rows.push(tipOn(h("div", "r", [h("div", "who", [t("span", "", x.agent + " · " + x.grade + " · n=" + x.runs), t("span", "meta", x.model)]), trk, cnt(x.quota, "var(--warn)"), cnt(x.error, "var(--crit)")]),
        x.agent + " " + x.model + " (" + x.grade + "): " + x.runs + " runs, first pass " + pct(fp) + ", quota " + x.quota + ", error " + x.error + ", median " + x.median_min + " min"));
    });
    dl = stack([h("div", "dl", rows), legend([["first pass at or above 60%", "var(--good)"], ["below 60%", "var(--crit)"], ["open ring: fewer than 5 runs", "var(--faint)"]])]);
  }
  if (D.kept) {
    var plural = function (n, word) { return n + " " + word + (n === 1 ? "" : "s"); };
    var keptLine = t("p", "meta", plural(D.kept.tasks, "task") + " kept by the coordinator in " + plural(D.kept.receipts, "receipt") + (D.kept.handed_off == null ? "" : "; " + plural(D.kept.handed_off, "implementation run") + " handed off"));
    dl = stack([keptLine, dl || t("div", "nodata", "no data: " + (missing("delegation") || "ledger is empty"))]);
  }
  delegation.appendChild(pane("delegation", "from the dispatch ledger", "wide", dl, missing("delegation") || "ledger is empty", "dl"));

  /* Judge receipts and a separate outcome association from the ledger. */
  if (D.judge) {
    var j = D.judge, judgeParts = [];
    if (j.receipts) {
      judgeParts.push(t("h3", "", "Use"));
      judgeParts.push(hbars(j.use.map(function (x) { return { n: x.site + " · " + x.grader, v: x.count }; }), "var(--p)"));
      [["Usable answers", j.usable_answers.share, j.usable_answers.validated, j.usable_answers.calls],
       ["Followed", j.followed.share, j.followed.yes, j.followed.validated]].forEach(function (x) {
        var bar = h("i"), value = pct(x[1]) + " (" + x[2] + "/" + x[3] + ")";
        bar.style.width = ((x[1] || 0) * 100) + "%"; bar.style.background = "var(--p)";
        judgeParts.push(h("div", "hb", [h("div", "r", [t("span", "n", x[0]),
          h("span", "trk", [bar, t("span", "v", x[1] == null ? "no answers" : value)])])]));
      });
    } else judgeParts.push(t("p", "meta", j.note));
    judgeParts.push(t("h3", "", "Outcome association"));
    if (j.outcome_association.length) {
      var jax = h("div", "ax", [t("span", "", "0%"), t("span", "", "60%"), t("span", "", "100%")]);
      jax.children[0].style.left = "0"; jax.children[1].style.left = "60%"; jax.children[2].style.left = "100%";
      var jrows = [h("div", "r h", [h("span"), jax, t("span", "", "first pass"), h("span")])];
      j.outcome_association.forEach(function (x) {
        var small = x.runs < 5, col = small ? "var(--faint)" : x.first_pass < .6 ? "var(--crit)" : "var(--good)";
        var track = h("div", "trk"), line = h("i", "th"), stem = h("i", "stem"), dot = h("i", "dot" + (small ? " open" : ""));
        line.style.left = "60%";
        stem.style.width = (x.first_pass * 100) + "%"; stem.style.background = col;
        dot.style.left = (x.first_pass * 100) + "%"; dot.style.color = col;
        tipOn(dot, "first pass " + pct(x.first_pass) + (small ? " (fewer than 5 runs, not judged)" : ""));
        track.appendChild(line); track.appendChild(stem); track.appendChild(dot);
        jrows.push(h("div", "r", [t("span", "who", x.route_by + " · n=" + x.runs), track, t("span", "", pct(x.first_pass)), h("span")]));
      });
      judgeParts.push(h("div", "dl", jrows));
      judgeParts.push(legend([["first pass at or above 60%", "var(--good)"], ["below 60%", "var(--crit)"], ["open ring: fewer than 5 runs, not judged", "var(--faint)"]]));
    } else judgeParts.push(t("p", "meta", j.outcome_note));
    judgeParts.push(t("p", "meta", "Not measured: cost, latency and accuracy. The outcome is an association, not proof the judge was right."));
    delegation.appendChild(pane("Judge", "receipts and dispatch ledger", "wide", stack(judgeParts)));
  } else delegation.appendChild(pane("Judge", "receipts and dispatch ledger", "wide", null, missing("judge") || "not available yet"));

  /* Tables follow their panes; sources and footer stay shared. */
  var tabs = TABS.get("overview").tableRows, delegationTables = TABS.get("delegation").tableRows;
  if (D.use) tabs.push(tableOf("use", ["name", "calls"], D.use.map(function (u) { return [u.name, u.count]; })));
  if (D.load && D.load.top) tabs.push(tableOf("load (estimate)", ["skill", "tokens", "loads"], D.load.top.map(function (x) { return [x.name, x.tokens, x.loads]; })));
  if (D.depth) tabs.push(tableOf("depth", ["depth", "receipts", "reworked"], D.depth.map(function (x) { return [x.depth, x.receipts, x.reworked]; })));
  if (D.delegation) delegationTables.push(tableOf("delegation", ["agent / model / grade", "runs", "first pass", "quota", "error", "median min", "rework"], D.delegation.map(function (x) { return [x.agent + " / " + x.model + " / " + x.grade, x.runs, pct(x.first_pass), x.quota, x.error, x.median_min, x.rework]; })));
  if (D.kept && D.kept.rows.length) delegationTables.push(tableOf("kept by the coordinator", ["coordinator / reason / settled by", "receipts", "tasks"], D.kept.rows.map(function (x) { return [x.coordinator + " / " + x.reason + " / " + x.route_by, x.receipts, x.tasks]; })));
  if (D.judge) {
    if (D.judge.use) delegationTables.push(tableOf("Judge · Use", ["site / grader", "decisions"], D.judge.use.map(function (x) { return [x.site + " / " + x.grader, x.count]; })));
    if (D.judge.receipts) delegationTables.push(tableOf("Judge · answers", ["measure", "count", "total", "share"], [
      ["Usable answers", D.judge.usable_answers.validated, D.judge.usable_answers.calls, pct(D.judge.usable_answers.share)],
      ["Followed", D.judge.followed.yes, D.judge.followed.validated, pct(D.judge.followed.share)]]));
    if (D.judge.outcome_association.length) delegationTables.push(tableOf("Judge · Outcome association", ["routed by", "runs", "first pass"], D.judge.outcome_association.map(function (x) { return [x.route_by, x.runs, pct(x.first_pass)]; })));
  }
  if (D.reviews) TABS.get("reviews").tableRows.push(tableOf("reviews", ["pr", "verdicts"], D.reviews.map(function (x) { return [x.repo + " #" + x.pr, x.verdicts.join(" → ")]; })));
  if (act.length) {
    var wk = [];
    for (var w = 0; w < act.length; w += 7) { var sum = 0; act.slice(w, w + 7).forEach(function (a) { sum += a.count; }); wk.push([act[w].date, sum]); }
    tabs.push(tableOf("activity by week", ["week of", "events"], wk));
  }
  TABS.forEach(function (tab) {
    if (tab.tableRows.length) {
      tab.tables = tab.panel.appendChild(h("details", "", [t("summary", "", "show the data as tables"), h("div", "tables", tab.tableRows)]));
      tab.tables.open = !!tab.tablesOpen;
    }
  });
  selectTab(selected, false);
  if (focusedTab) {
    TABS.forEach(function (tab) { tab.button.tabIndex = tab === focusedTab ? 0 : -1; });
    focusedTab.button.focus();
  }

  var src = h("div", "src", [t("b", "", "sources")]);
  (D.sources || []).forEach(function (x) { src.appendChild(tipOn(t("span", x.ok ? "" : "no", x.name), x.note || "")); });
  genEl = t("span", "", D.generated || "—");
  app.appendChild(h("div", "status", [src, h("span", "", ["sessions " + num(sess.total) + " · with edits " + num(sess.with_edits) + " · unclassified " + num(sess.unclassified) + " · writer errors " + num(D.errors) + " · generated ", genEl])]));
  freshnessEl = app.appendChild(t("p", "status", ""));
  updateFreshness();
  }
  draw();

  document.addEventListener("pointermove", function (e) {
    var el = e.target.closest && e.target.closest("[data-tip]");
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.getAttribute("data-tip"); tip.hidden = false;
    tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 270) + "px"; tip.style.top = (e.clientY + 14) + "px";
  });
  document.addEventListener("focusin", function (e) {
    var el = e.target.getAttribute && e.target.getAttribute("data-tip");
    if (!el) return;
    var b = e.target.getBoundingClientRect(); tip.textContent = el; tip.hidden = false;
    tip.style.left = Math.min(b.left, window.innerWidth - 270) + "px"; tip.style.top = (b.bottom + 6) + "px";
  });
  document.addEventListener("focusout", function () { tip.hidden = true; });

  /* Live update: while the tab is visible, load data.js again. A page on disk cannot watch a file, and this needs no server. */
  var POLL_MS = 5000, loading = false;
  function content(d) { return JSON.stringify(d, function (key, v) { return key === "generated" || key === "freshness" ? undefined : v; }); }
  var shown = content(dataNow());
  function apply() {
    var next = dataNow();
    if (!next || next === D) return;
    D = next;
    var c = content(next);
    if (c !== shown) { shown = c; draw(); } else { genEl.textContent = next.generated || "—"; updateFreshness(); }
  }
  function poll() {
    updateFreshness();
    if (loading || document.visibilityState !== "visible") return;
    loading = true;
    var s = document.createElement("script");
    s.src = "data.js?t=" + Date.now();
    s.onload = s.onerror = function () { s.remove(); loading = false; apply(); };
    document.head.appendChild(s);
  }
  setInterval(poll, POLL_MS);
  document.addEventListener("visibilitychange", poll);
})();
</script>
</body>
</html>
