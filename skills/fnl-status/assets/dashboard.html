<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'">
<title>Vibecode Status</title>
<style>
html, body { margin: 0; }
[hidden] { display: none !important; }
/* One terminal window: shared prompt and KPIs above the tabbed panes. */
:root {
  --bg: #07040d; --field-top: #14081f; --surface: #0f0a19; --raised: #181029; --line: #2a1d40; --lane-track: var(--line); --status-fresh: var(--h2);
  --fg: #f7f2fc; --muted: #b9a6cf; --faint: #8f7ba8;
  --p: #7fe2ce; --brand: #7fe2ce; --violet: #b88cf0; --prompt: #7fe2ce; --glow: rgba(127, 226, 206, .4); --grid: rgba(247, 242, 252, .035);
  --good: #7fe2ce; --warn: #e3b341; --crit: #ff7b72;
  --h0: #181029; --h1: #1e5a55; --h2: #2b8c7d; --h3: #4fc0a8; --h4: #7fe2ce;
  --on1: #f7f2fc; --on2: #07040d; --on3: #07040d; --on4: #07040d;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --t-xs: 11px; --t-sm: 12px; --t-md: 13px; --t-lg: 15px; --t-kpi: clamp(30px, 6vw, 40px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f2fc; --field-top: #eadff6; --surface: #ffffff; --raised: #eadff6; --line: #d6c5e8; --lane-track: #eeebf0; --status-fresh: var(--good);
    --fg: #22123a; --muted: #5f4a7a; --faint: #7e6a99;
    --p: #7a3fa6; --brand: #9750c4; --violet: #7a3fa6; --prompt: #7a3fa6; --glow: rgba(122, 63, 166, 0); --grid: rgba(34, 18, 58, .05);
    --good: #1b7a66; --warn: #d19a00; --warn-text: #8a6400; --crit: #cf222e;
    --h0: #eadff6; --h1: #d6bdee; --h2: #b88fdc; --h3: #9455c4; --h4: #7a3fa6;
    --on1: #22123a; --on2: #22123a; --on3: #ffffff; --on4: #ffffff;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f7f2fc; --field-top: #eadff6; --surface: #ffffff; --raised: #eadff6; --line: #d6c5e8; --lane-track: #eeebf0; --status-fresh: var(--good);
  --fg: #22123a; --muted: #5f4a7a; --faint: #7e6a99;
  --p: #7a3fa6; --brand: #9750c4; --violet: #7a3fa6; --prompt: #7a3fa6; --glow: rgba(122, 63, 166, 0); --grid: rgba(34, 18, 58, .05);
  --good: #1b7a66; --warn: #d19a00; --warn-text: #8a6400; --crit: #cf222e;
  --h0: #eadff6; --h1: #d6bdee; --h2: #b88fdc; --h3: #9455c4; --h4: #7a3fa6;
    --on1: #22123a; --on2: #22123a; --on3: #ffffff; --on4: #ffffff;
  color-scheme: light;
}
body {
  background: var(--bg); color: var(--fg); font: var(--t-md)/1.5 var(--mono);
  background-image: radial-gradient(var(--grid) 1px, transparent 1px), linear-gradient(180deg, var(--field-top), var(--bg) 420px);
  background-size: 22px 22px, 100% 100%; background-repeat: repeat, no-repeat;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.win { max-width: 1120px; margin: 0 auto; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--bg) 92%, transparent); overflow: hidden; overflow: clip; }
.bar { display: flex; flex-wrap: nowrap; align-items: center; gap: 10px; padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--muted); font-size: var(--t-sm); }
.dots { display: flex; gap: 6px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); display: block; }
.bar .dots, .bar .theme { flex-shrink: 0; }
.bar .theme { margin-left: auto; }
.theme { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.theme button { font: inherit; font-size: var(--t-xs); color: var(--muted); background: transparent; border: 0; padding: 2px 10px; cursor: pointer; }
.theme button + button { border-left: 1px solid var(--line); }
.theme button:hover { color: var(--fg); }
.theme button[aria-pressed="true"] { background: var(--raised); color: var(--prompt); }
button:focus-visible, summary:focus-visible, .heat i:focus-visible, svg:focus-visible { outline: 2px solid var(--p); outline-offset: 2px; }
.screen { padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; position: relative; }
.tablist { display: flex; min-width: 0; max-width: 100%; flex: 1; white-space: nowrap; }
.tablist button { flex: 0 1 auto; min-width: 0; white-space: nowrap; font: inherit; font-size: var(--t-xs); color: var(--muted); background: var(--surface); border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; }
.tablist button[aria-selected="true"] { color: var(--prompt); border-bottom-color: var(--good); }
.tablist .count { margin-left: 6px; font-size: var(--t-xs); }
.tabpanel { display: grid; gap: 16px; min-width: 0; max-height: 75vh; overflow: auto; }
.cmd { font-size: var(--t-lg); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.cmd .ps { color: var(--prompt); text-shadow: 0 0 12px var(--glow); }
.cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--prompt); vertical-align: text-bottom; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
.meta { color: var(--muted); font-size: var(--t-sm); }

/* KPI tiles: label, value with a 12-week column chart on the baseline, delta. */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; display: grid; gap: 8px; }
.kpi .k { color: var(--muted); font-size: var(--t-sm); }
.kpi .m { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.kpi .v { font-size: var(--t-kpi); font-weight: 700; line-height: 1; text-shadow: 0 0 22px var(--glow); }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 36px; flex: 1; max-width: 110px; }
.spark i { flex: 1; max-width: 12px; border-radius: 3px 3px 0 0; background: var(--p); opacity: .38; display: block; }
.spark i:last-child { opacity: 1; }
.kpi .d { font-size: var(--t-xs); color: var(--muted); min-height: 1.4em; }
.kpi .d.up { color: var(--good); } .kpi .d.down { color: var(--crit); }

/* Panes */
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.g2 .tall { grid-row: span 2; }
.pane { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; display: flex; flex-direction: column; }
.pane > h2 { margin: 0; padding: 9px 14px; font-size: var(--t-sm); font-weight: 600; color: var(--fg); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.pane > h2 span:first-child::before { content: "▍"; color: var(--prompt); margin-right: 6px; }
.pane > h2 span + span { color: var(--faint); font-weight: 400; }
.pane .body { padding: 14px; display: grid; gap: 14px; align-content: start; flex: 1; }
.pane.wide { grid-column: 1 / -1; }
.nodata { color: var(--faint); }
.nodata::before { content: "// "; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: var(--t-xs); }
.legend b { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.stat { display: flex; align-items: baseline; gap: 10px; }
.stat strong { font-size: 28px; line-height: 1; }
.stat span { color: var(--muted); font-size: var(--t-sm); }

/* Horizontal bars: baseline at the left, 4px rounded data end, value at the tip, no track. */
.hb { display: grid; gap: 8px; }
.tall .hb { gap: 12px; }
.hb .r { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr); gap: 10px; align-items: center; font-size: var(--t-sm); }
.hb .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .trk { display: flex; align-items: center; gap: 8px; padding-right: 3.6em; border-left: 1px solid var(--line); min-height: 14px; }
.hb .trk > i, .hb .stk { height: 12px; flex: none; display: flex; gap: 2px; }
.hb .trk > i { border-radius: 0 4px 4px 0; min-width: 2px; display: block; }
.hb .stk i { display: block; height: 100%; min-width: 2px; }
.hb .stk i:first-child { border-radius: 0 0 0 0; } .hb .stk i:last-child { border-radius: 0 4px 4px 0; }
.hb .v { color: var(--muted); white-space: nowrap; font-size: var(--t-xs); }

/* Router composition: one stacked bar with an "eligible" bracket. */
.seg { display: flex; gap: 2px; height: 16px; }
.seg i { display: block; min-width: 3px; border-radius: 2px; }
.brk { height: 6px; border: 1px solid var(--faint); border-top: 0; border-radius: 0 0 3px 3px; margin-top: 4px; }
.brk + .meta { margin-top: -6px; }

/* Delegation: lollipop on a 0-100% axis, quota and error as aligned counts. */
.dl { display: grid; gap: 4px; }
.dl .r { display: grid; grid-template-columns: minmax(0, 17em) minmax(0, 1fr) 3.4em 3.4em; gap: 12px; align-items: center; font-size: var(--t-sm); padding: 6px 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.dl .r.h { border-top: 0; padding: 0 0 2px; color: var(--faint); font-size: var(--t-xs); }
.dl .who { min-width: 0; line-height: 1.25; } .dl .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dl .ax { position: relative; height: 14px; } .dl .ax span { position: absolute; transform: translateX(-50%); }
.dl .ax span:first-child { transform: none; } .dl .ax span:last-child { transform: translateX(-100%); }
.dl .trk { position: relative; height: 22px; }
.dl .trk::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 1px; background: var(--line); }
.dl .th { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--faint); }
.dl .stem { position: absolute; left: 0; top: 10px; height: 2px; margin-top: -.5px; border-radius: 0 1px 1px 0; opacity: .55; }
.dl .dot { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; box-sizing: border-box; border: 2px solid; box-shadow: 0 0 0 2px var(--surface); background: currentColor; }
.dl .dot.open { background: var(--surface); }
.dl .na { position: absolute; left: 0; top: 3px; color: var(--faint); font-size: var(--t-xs); }
.dl .c { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.dl .c::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.dl .c.z { opacity: .4; }

/* Review gate timeline */
.rv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 8px 20px; }
.rv .r { display: grid; grid-template-columns: minmax(0, 10em) minmax(0, 1fr); gap: 12px; align-items: center; font-size: var(--t-sm); }
.rv .seq { display: flex; align-items: center; min-width: 0; }
.rv .review-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv .more-rounds { color: var(--muted); font-size: var(--t-xs); margin-left: 6px; white-space: nowrap; }
.rv .seq svg { width: 12px; height: 12px; flex: none; }
.rv .seq .ln { flex: none; width: 6px; height: 2px; background: var(--line); }

/* Activity as a compact month calendar: Monday first, a small date in each cell, shade by count (the count is in the tooltip and the aria label). A side column carries the month's numbers. */
.calwrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 28px; align-items: start; }
.calmain { display: grid; gap: 8px; width: max-content; max-width: 100%; }
.calnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.calnav strong { font-size: var(--t-md); }
.calnav button { font: inherit; font-size: 15px; line-height: 1; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
.calnav button:hover:not(:disabled) { color: var(--fg); background: var(--raised); }
.calnav button:disabled { opacity: .35; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 28px); gap: 3px; }
.cal .wd { color: var(--faint); font-size: 10px; text-align: center; }
.cal .dy { aspect-ratio: 1; border-radius: 4px; background: var(--h0); padding: 2px 3px; font-size: 9px; line-height: 1; color: var(--muted); min-width: 0; }
.cal .dy.pad { visibility: hidden; }
.calside { display: grid; gap: 14px; align-content: start; }
.stat2 strong { display: block; font-size: 22px; line-height: 1.1; }
.stat2 span { color: var(--muted); font-size: var(--t-xs); }
.wdc { display: flex; align-items: flex-end; gap: 4px; height: 56px; }
.wdc div { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; min-width: 0; }
.wdc i { width: 100%; max-width: 14px; border-radius: 3px 3px 0 0; background: var(--p); opacity: .4; display: block; }
.wdc i.max { opacity: 1; }
.wdc em { font-style: normal; font-size: 10px; color: var(--faint); }
.cal-title { color: var(--muted); font-size: var(--t-xs); margin-bottom: 4px; }
.cal .dy.out { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--faint); }
.cal .dy[data-l="1"] { background: var(--h1); color: var(--on1); } .cal .dy[data-l="2"] { background: var(--h2); color: var(--on2); }
.cal .dy[data-l="3"] { background: var(--h3); color: var(--on3); } .cal .dy[data-l="4"] { background: var(--h4); color: var(--on4); }
.cal .dy.now { box-shadow: 0 0 0 2px var(--p); }
.scale { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: var(--t-xs); justify-content: flex-end; }
.scale i { width: 12px; height: 12px; border-radius: 2px; display: block; }

.status { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; align-items: center; color: var(--faint); font-size: var(--t-xs); }
.info-button { width: 14px; height: 14px; padding: 0; border: 0; background: transparent; color: var(--faint); font: inherit; font-size: 14px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.info-button:hover, .info-button:focus-visible { color: var(--fg); }
.info-button:focus-visible { outline: 2px solid var(--p); outline-offset: 3px; border-radius: 50%; }
.pane-aside { display: inline-flex; align-items: center; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--status-fresh); flex: none; }
.status-dot[data-state="quiet"] { background: var(--warn); }
.status-dot[data-state="stale"] { background: var(--crit); }
details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details > summary { cursor: pointer; color: var(--muted); font-size: var(--t-sm); padding: 8px 14px; }
details .tables { padding: 4px 14px 14px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.tbl { overflow-x: auto; }
.tbl h3 { margin: 0 0 6px; font-size: var(--t-sm); color: var(--muted); font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: var(--t-xs); }
th { text-align: left; color: var(--muted); font-weight: 500; padding: 3px 10px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 3px 10px 3px 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.r, th.r { text-align: right; }
.win { position: relative; }
.ghost { background: var(--raised); border-radius: 4px; display: block; }
.skel .tabpanel:not([hidden]) .ghost, .skel .screen > .kpis .ghost { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .skel .ghost { animation: none; } }
.spark i.ghost { background: var(--raised); opacity: 1; }
.spark i.gap { opacity: .2; }
.cal .dy.ghost { background: var(--raised); padding: 0; }
.grow { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr); gap: 10px; align-items: center; }
.skel .nodata { display: none; }
.skel .kpi .v { color: var(--faint); text-shadow: none; }
/* Lego marks follow the approved local prototype; tokens stay theme-aware. */
.lanes { display: grid; gap: 10px; }
.lane { display: grid; grid-template-columns: 150px minmax(0, 1fr) 54px; gap: 14px; align-items: center; min-width: 0; }
.lane-label { position: relative; display: grid; min-width: 0; padding-right: 16px; }
.lane-identity { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 12px; }
.lane-task { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--faint); }
.lane-track { display: block; min-width: 0; width: 100%; height: 14px; overflow: visible; }
.lane-fill { transform-origin: left; }
.lane-value { text-align: right; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.no-process { position: absolute; right: 0; top: 3px; }
.lego-brick { display: block; flex: none; overflow: hidden; }
.lanes .nodata::before { content: none; }
.ghost-bricks { display: flex; gap: 6px; opacity: .5; }
.agent-capacity { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 18px; margin-top: 6px; }
.capacity-block { min-width: 0; }
.capacity-caption { color: var(--faint); font-size: 11px; margin-bottom: 6px; }
.slots { display: flex; gap: 4px; flex-wrap: wrap; }
.live-sessions { display: flex; align-items: center; gap: 10px; min-height: 14px; }
.live-session { color: var(--faint); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.quota-pools { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); gap: 5px 10px; }
.quota-pools:has(.quota-pool:only-child) { grid-template-rows: auto; }
.quota-pool { display: flex; align-items: center; gap: 5px; min-width: 0; }
.quota-pool-name { color: var(--faint); font-size: 10px; max-width: 8ch; overflow: hidden; white-space: nowrap; }
.quota-pool-icon { flex: none; color: var(--faint); }
.quota-bricks { display: flex; align-items: center; gap: 2px; }
.quota-bricks .quota-brick { width: 9px; }
.quota-block { max-width: 100%; }
@media (max-width: 600px) {
  .quota-pools { display: flex; flex-wrap: wrap; }
}
.quota-bricks.unverified .brick-body { stroke-dasharray: 2 2; }
.quota-unknown { color: var(--faint); font-size: 11px; }
.running-row { overflow-wrap: anywhere; min-width: 0; }
.project-table { overflow-x: auto; max-width: 100%; }
.active-projects { min-width: 0; }
.active-project { display: grid; grid-template-columns: 150px minmax(0, 1fr) 54px; gap: 14px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.active-project:first-child { border-top: 0; padding-top: 0; }
.active-identity { min-width: 0; }
.active-label { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.active-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 11px; color: var(--faint); }
.active-hosts { display: inline-flex; gap: 4px; }
.active-host { font-size: 10px; }
.active-last { font-size: 11px; }
.active-percent { font-size: 22px; line-height: 1; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.project-done { justify-self: end; }
.project-detail { min-width: 0; }
.feature { min-width: 0; margin-bottom: 6px; }
.spec-head { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; color: var(--faint); font-size: 10px; }
.spec-label, .finished-stories { white-space: nowrap; }
.spec-rule { height: 1px; flex: 1; background: var(--line); }
.story { display: grid; grid-template-columns: 30px minmax(0, 1fr) 38px; gap: 8px; align-items: start; margin: 2px 0; font-size: 10px; color: var(--faint); }
.story + .story { margin-top: 8px; }
.story-label { align-self: start; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.story-count { text-align: right; font-variant-numeric: tabular-nums; }
.cells { display: flex; gap: 2px; flex-wrap: wrap; min-width: 0; }
.task-brick { width: 15px; height: 11px; }
.task-legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--faint); font-size: 11px; margin-top: 8px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.pipeline-project { grid-template-columns: 150px minmax(0, 1fr); gap: 4px 14px; padding: 8px 0; min-height: 40px; align-items: start; }
.pipeline-project .active-identity { grid-column: 1; grid-row: 1; }
.pipeline-project .active-meta { margin-top: 3px; }
.pipeline-project .project-detail { grid-column: 2; grid-row: 1; }
.pipeline-project .active-percent, .pipeline-project .project-done { display: none; }
.pipeline-detail { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.pipeline-item { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; width: 100%; min-width: 0; }
