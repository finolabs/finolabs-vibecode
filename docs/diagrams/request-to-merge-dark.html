<p class="eyebrow">Swimlane · finolabs-vibecode</p>
<h1>One request, from your words to a merged pull request</h1>
<p class="sub">What runs for you on its own, and where it waits for you: your words go through the router, a delegated agent, checks and two reviews by another model family; the merge and the release wait for your yes.</p>

<title id="request-to-merge-dark-title">One request, from your words to a merged pull request</title>
<desc id="request-to-merge-dark-desc">Swimlane of one coding request: you describe it; your agent&#x27;s coding-router names the session and picks depth and gates; delegate picks an agent by the assignment matrix and records the dispatch; another agent builds it; checks rerun the tests and write a receipt; reviewers of another model family post code and security markers; the flow waits for your go to merge; the agent merges only if merge_check.py passes, removes the worktree and branch it created and lists the rest; release waits for you.</desc>
