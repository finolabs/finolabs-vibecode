<p class="eyebrow">Loop · finolabs-vibecode</p>
<h1>Keeping a long session healthy</h1>
<p class="sub">session-hygiene names the session, watches its context size and writes a handover before compaction, so the work picks up where it left off.</p>
<svg viewBox="0 0 1280 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-health-dark-title session-health-dark-desc">
<title id="session-health-dark-title">Keeping a long session healthy</title>
<desc id="session-health-dark-desc">Loop of session hygiene: the agent names the session at the first task and when the phase changes; reads the context size from the status line snapshot or, on request, the probe (Claude Code&#x27;s /context or Codex&#x27;s app-server); context_steward.py answers ok, prepare from 80 percent, wait or compact at your threshold; on prepare the agent writes a private handover; the host compacts at its threshold or you run /compact; the compact hook at session start re-injects the handover and reminds the agent to check the title.</desc>
<defs><marker id="session-health-dark-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#BCBCD0"/></marker><marker id="session-health-dark-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E5D2F4"/></marker><marker id="session-health-dark-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#87D3E1"/></marker></defs>
<rect width="100%" height="100%" fill="#050510"/>
<path d="M360,96 H480" fill="none" stroke="#BCBCD0" stroke-width="1.2" marker-end="url(#session-health-dark-default)"/>
<path d="M800,96 H920" fill="none" stroke="#BCBCD0" stroke-width="1.2" marker-end="url(#session-health-dark-default)"/>
<path d="M1080,152 V272" fill="none" stroke="#BCBCD0" stroke-width="1.2" marker-end="url(#session-health-dark-default)"/>
<path d="M920,328 H800" fill="none" stroke="#BCBCD0" stroke-width="1.2" marker-end="url(#session-health-dark-default)"/>
<path d="M480,328 H360" fill="none" stroke="#BCBCD0" stroke-width="1.2" marker-end="url(#session-health-dark-default)"/>
<path d="M200,272 V152" fill="none" stroke="#BCBCD0" stroke-width="1.2" marker-end="url(#session-health-dark-default)"/>
<rect class="lm" x="1088" y="204" width="64" height="16" rx="2" fill="#050510"/><text x="1092" y="216" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">PREPARE</text>
<rect class="lm" x="208" y="204" width="96" height="16" rx="2" fill="#050510"/><text x="212" y="216" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">CHECK TITLE</text>
<g class="node">
<rect x="40" y="40" width="320" height="112" rx="8" fill="#050510"/>
<rect x="40" y="40" width="320" height="112" rx="8" fill="#16162A" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>
<text x="200" y="72" fill="#FFFFFF" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Name the session</text>
<text x="200" y="96" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">at the first task</text>
<text x="200" y="116" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">again when the phase changes</text>
<text x="200" y="136" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">project scope: activity</text>
</g>
<g class="node">
<rect x="480" y="40" width="320" height="112" rx="8" fill="#050510"/>
<rect x="480" y="40" width="320" height="112" rx="8" fill="#16162A" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>
<text x="640" y="72" fill="#FFFFFF" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Read context size</text>
<text x="640" y="96" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">status line snapshot, or</text>
<text x="640" y="116" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">the probe on request:</text>
<text x="640" y="136" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">/context or Codex app-server</text>
</g>
<g class="node">
<rect x="920" y="40" width="320" height="112" rx="8" fill="#050510"/>
<rect x="920" y="40" width="320" height="112" rx="8" fill="#16162A" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>
<text x="1080" y="72" fill="#FFFFFF" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Steward check</text>
<text x="1080" y="96" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">context_steward.py check</text>
<text x="1080" y="116" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ok · prepare from 80%</text>
<text x="1080" y="136" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">wait or compact at threshold</text>
</g>
<g class="node">
<rect x="920" y="272" width="320" height="112" rx="8" fill="#050510"/>
<rect x="920" y="272" width="320" height="112" rx="8" fill="rgba(151,80,196,0.18)" stroke="#E5D2F4" stroke-width="1.2"/>
<text x="1080" y="304" fill="#FFFFFF" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Prepare a handover</text>
<text x="1080" y="328" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">goal, decisions, next action</text>
<text x="1080" y="348" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">handover_state.py write</text>
<text x="1080" y="368" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">private · 8 KiB · 24 hours</text>
</g>
<g class="node">
<rect x="480" y="272" width="320" height="112" rx="8" fill="#050510"/>
<rect x="480" y="272" width="320" height="112" rx="8" fill="rgba(188,188,208,0.10)" stroke="#8B8BA6" stroke-width="1" stroke-dasharray="4,3"/>
<text x="640" y="304" fill="#FFFFFF" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Compaction</text>
<text x="640" y="328" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">the host at its threshold,</text>
<text x="640" y="348" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">or you run /compact</text>
<text x="640" y="368" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">the plugin never sends it</text>
</g>
<g class="node">
<rect x="40" y="272" width="320" height="112" rx="8" fill="#050510"/>
<rect x="40" y="272" width="320" height="112" rx="8" fill="#16162A" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>
<text x="200" y="304" fill="#FFFFFF" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Handover comes back</text>
<text x="200" y="328" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">compact hook at session start</text>
<text x="200" y="348" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">re-injects the handover</text>
<text x="200" y="368" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">reminds to check the title</text>
</g>
<text x="40" y="436" fill="#BCBCD0" font-size="16" font-weight="400" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="start">Re-injection is declared on Claude Code and Codex; live delivery is unverified. Antigravity keeps the manual handover,</text>
<text x="40" y="460" fill="#BCBCD0" font-size="16" font-weight="400" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="start">and the probe does not cover it. Every step here is the agent&#x27;s judgment; the scripts enforce their limits.</text>
<line x1="40" y1="496" x2="1240" y2="496" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
<text x="40" y="528" fill="#BCBCD0" font-size="12" font-weight="500" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="start">LEGEND</text>
<rect x="160" y="516" width="32" height="16" rx="4" fill="#16162A" stroke="rgba(255,255,255,0.55)" stroke-width="1"/>
<text x="204" y="528" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">the agent, on its own</text>
<rect x="412" y="516" width="32" height="16" rx="4" fill="rgba(151,80,196,0.18)" stroke="#E5D2F4" stroke-width="1"/>
<text x="456" y="528" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">before compaction</text>
<rect x="632" y="516" width="32" height="16" rx="4" fill="rgba(188,188,208,0.10)" stroke="#8B8BA6" stroke-width="1" stroke-dasharray="4,3"/>
<text x="676" y="528" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">the host or you</text>
<path d="M836,524 H868" stroke="#BCBCD0" stroke-width="1.2" fill="none" marker-end="url(#session-health-dark-default)"/>
<text x="880" y="528" fill="#BCBCD0" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">next step</text>
</svg>
