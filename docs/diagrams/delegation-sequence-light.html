<p class="eyebrow">Sequence · finolabs-vibecode</p>
<h1>One delegated task, dispatch to merge</h1>
<p class="sub">The ledger records the run and prints its name; the coordinator verifies and accepts; reviewers, of another family when one is available, post markers that merge_check.py reads for the current head.</p>
<svg viewBox="0 0 1280 1020" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delegation-sequence-light-title delegation-sequence-light-desc">
<title id="delegation-sequence-light-title">One delegated task, dispatch to merge</title>
<desc id="delegation-sequence-light-desc">Sequence diagram across six lanes: coordinator (delegate), dispatch ledger (ledger.py), implementer, code reviewer (fnl-reviewer), security reviewer (fnl-security-reviewer) and the pull request. The coordinator grades, routes with route_pick.py and briefs; ledger.py start returns the id and prints the run label on stderr, which goes into the host's name field; the implementer runs in the background and reports. The coordinator runs log_scan.py and verify_claim.py, then ledger.py finish, which by default refuses an accepted outcome without a passing receipt at the head (an --accept-unverified acceptance is logged). The coordinator opens the pull request, review_route.py picks a reviewer family other than the author's when one is available (otherwise the same family, and a security trigger then needs the user's decision), each reviewer posts its marker with post_review.py, a REWORK verdict sends the work back for a new head, and when merge_check.py passes the merge is pinned to the reviewed head with the owner's go.</desc>
