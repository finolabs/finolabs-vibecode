<p class="eyebrow">Scopes · finolabs-vibecode</p>
<h1>Where your settings live: user scope and project scope</h1>
<p class="sub">Your own choices live in your home folder; a repository&#x27;s check list and settings live in that repository, and count only while they match what you approved.</p>
<svg viewBox="0 0 1280 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="settings-scopes-light-title settings-scopes-light-desc">
<title id="settings-scopes-light-title">Where your settings live: user scope and project scope</title>
<desc id="settings-scopes-light-desc">Two scopes of settings: user scope in ~/.finolabs/vibecode/ holds host.md (roles, judge, assignment matrix, afk choices and lease limits, delegation mode) and the approved digests; project scope in the repository&#x27;s .finolabs/vibecode/ holds checks.json and settings.json (ledger, tasks, parallel limit, label and optional afk overrides). Setup writes host.md and, after your yes, the digest of each project file; a project file counts only while its bytes match that digest, so a branch or pull request cannot change it or widen what you approved.</desc>
