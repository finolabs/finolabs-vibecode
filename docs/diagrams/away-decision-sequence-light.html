<p class="eyebrow">Flow · finolabs-vibecode</p>
<h1>Away from keyboard: what afk does while you are gone</h1>
<p class="sub">Start afk once; every session on the machine checks each action against the lease, does only what is allowed, parks the rest for you, settles questions on a ladder and asks you to review each decision when you are back.</p>
<svg viewBox="0 0 1280 856" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="away-decision-sequence-light-title away-decision-sequence-light-desc">
<title id="away-decision-sequence-light-title">Away from keyboard: what afk does while you are gone</title>
<desc id="away-decision-sequence-light-desc">Flow of an afk lease: you start it once and one lease covers every session on the machine, with limits from your setup and approved project files able to set task choice, push and merge; before each action every session runs autopilot.py check, acts and logs on Tier 1 and parks Tier 3 work, telling you once; credentials, the agent&#x27;s own limits, production, real users or customer data, unlisted deploys and releases and any category set to stop always park; a question it would ask you goes up the decide ladder (a recorded rule, Jev at 0.8 or more, an advisor of another family, the host&#x27;s own choice), checked before and after; when you return you stop the lease and mark each decision kept or reversed, and reversals go to the knowledge base.</desc>
